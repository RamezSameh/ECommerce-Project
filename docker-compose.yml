version: "3.9"
services:
  api:
    build: .
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_KEY=${JWT_KEY:-THIS_IS_MY_SUPER_SECRET_KEY_123456}
      - ConnectionStrings__DefaultConnection=Server=db;Database=ECommerceDb;User=sa;Password=Your_password123;TrustServerCertificate=True
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - Logging__LogLevel__Default=Information
    depends_on:
      - db
      - redis
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net
    volumes:
      - redis-data:/data

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: Your_password123
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"
    networks:
      - ecommerce-net
    volumes:
      - sql-data:/var/opt/mssql

networks:
  ecommerce-net:

volumes:
  sql-data:
  redis-data:
